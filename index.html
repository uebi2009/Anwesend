<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anwesenheitsliste</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--line:#444;--card:rgba(255,255,255,.86);--head:#f6e3e5;--ok:#1b7a3a;--mut:#666;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--fg:#eee;--line:#aaa;--card:rgba(27,27,27,.86);--head:#333;--ok:#4cc77a;--mut:#aaa}}
:root[data-theme="dark"]{--card:rgba(27,27,27,.86);--bg:#1b1b1b;--fg:#eee;--line:#aaa;--head:#333;--ok:#4cc77a;--mut:#aaa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:12px;background:linear-gradient(180deg,#c8102e 0,#8f0b20 55%,#5c0715 100%) fixed;color:var(--fg);min-height:100vh;font:15px system-ui,-apple-system,Segoe UI,sans-serif}
h1{font-size:22px;margin:0 0 12px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.5);letter-spacing:.5px}
h1::after{content:'';display:block;height:9px;margin-top:8px;border-radius:2px;background:repeating-linear-gradient(-45deg,#ffd400 0 14px,#1a1a1a 14px 28px)}
.meta,.bar{background:var(--bg);border-radius:10px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.wrap{background:var(--bg);border-radius:10px;padding:6px;box-shadow:0 2px 8px rgba(0,0,0,.35);margin:10px 0}
th{border-bottom:3px solid #c8102e}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.meta label{display:flex;gap:6px;align-items:center}
select{font:inherit;color:inherit;background:var(--bg);border:0;border-bottom:1px solid var(--line);padding:3px}
input[type=text],input[type=date]{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--line);padding:3px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{border:1px solid var(--line);padding:3px 6px;text-align:center}
th{background:var(--head)}
td.n{width:32px}
td.tl{color:var(--mut);font-size:13px}
tfoot td{border-top:3px double var(--line)}
td.nm input{width:100%;box-sizing:border-box}
td.c input{width:22px;height:22px}
canvas{display:block;width:100%;height:84px;touch-action:none;cursor:crosshair}
td.sg{width:380px;padding:0;position:relative}
.act{position:absolute;right:2px;top:1px;display:flex;gap:4px}
.clr{font-size:11px;border:0;background:transparent;color:var(--mut);cursor:pointer}
tr.done td.n{color:var(--ok);font-weight:700}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:0}
button.save{font:inherit;padding:10px 18px;border-radius:8px;border:0;background:#c8102e;color:#fff;cursor:pointer}
button.save.alt{background:transparent;color:inherit;border:1px solid var(--line)}
button.save:disabled{background:#999;cursor:not-allowed}
button.rst{font:inherit;background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
#msg{color:var(--mut);font-size:13px}
.meta,.bar,.wrap{background:var(--card)!important}
button.nb{width:100%;text-align:left;background:transparent;border:0;color:inherit;font:inherit;padding:10px 4px;cursor:pointer;border-bottom:1px dashed var(--line)}
.sgi{display:none;position:absolute;left:3px;top:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain;background:none}
td.sg{height:90px}
#ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:12px}
#ov[hidden]{display:none}
.dlg{background:var(--bg);color:var(--fg);border-radius:12px;padding:14px;width:100%;max-width:560px}
.dlg h2{font-size:17px;margin:0 0 8px}.dlg input{width:100%;box-sizing:border-box;margin-bottom:8px;font-size:16px}
#pc{width:100%;height:210px;background:#fff;border:2px solid var(--line);border-radius:8px;touch-action:none}
.dbt{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.dbt button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.dbt button.save{background:#c8102e;border:0;color:#fff}
/* kompakte Ansicht */
body{font-size:12.5px;padding:8px}
h1{font-size:17px;margin:0 0 8px}
h1::after{height:6px;margin-top:5px}
.meta,.bar{padding:6px 10px}
.meta{gap:6px 10px;margin-bottom:6px}
.wrap{padding:3px;margin:6px 0}
table{min-width:620px}
th,td{padding:2px 4px}
td.n{width:24px}
td.c input{width:16px;height:16px}
td.sg{width:260px;height:66px}
button.nb{padding:6px 4px}
.clr{font-size:10px}
button.save{padding:7px 12px}
button.rst{padding:6px 10px}
#msg{font-size:11px}
.dlg select{width:100%;box-sizing:border-box;margin-bottom:8px;font-size:16px;padding:6px 2px}
</style>
</head>
<body>
<h1>🚒 Anwesenheitsliste</h1>
<div class="meta">
  <label>Datum: <input type="date" id="date"></label>
  <label>Art: <select id="type"><option value="">– bitte wählen –</option><option>Einsatz</option><option>Ausbildungsdienst</option></select></label>
  <label>Bezeichnung: <input type="text" id="event" size="30"></label>
</div>
<div class="wrap">
<table>
<thead><tr><th>Nr.</th><th>Name</th><th>Bin entschuldigt</th><th>Unterschrift</th></tr></thead>
<tbody id="rows"></tbody>
<tfoot id="trow"></tfoot>
</table>
</div>
<div class="bar">
  <button class="save" id="pdf">Als PDF speichern</button>
  <button class="rst" id="rst">Zurücksetzen</button>
  <span id="msg"></span>
</div>
<div id="ov" hidden><div class="dlg"><h2>Unterschrift</h2><input id="pn" type="text" placeholder="Name"><select id="ps"></select><canvas id="pc"></canvas><div class="dbt"><button id="pcl" type="button">Löschen</button><button id="pca" type="button">Abbrechen</button><button id="pok" class="save" type="button">Übernehmen</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
// Kameraden-Liste für das Dropdown: später hier die echten Namen eintragen
var ROSTER=["Stephan Übensee","Danny Völler","Mathias Hellwig","Steve Schmidt","Sascha Herda","Manuel Henn","Fred Köhler","Ricardo Jobst","Thomas Papst","Torsten Brand","Lennert Köhler","Marco Brand"];
var N=20,KEY="anwesenheit-v1",S=["entschuldigt"];
var state={date:"",type:"",event:"",p:[]};
for(var i=0;i<N;i++)state.p.push({name:"",st:"",sig:""});
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.p&&o.p.length===N)state=o}}catch(e){}
if(!state.t)state.t={name:"",sig:""};
if(!state.cleared){state.p.forEach(function(p,i){if(!p.sig&&!p.st&&(p.name===ROSTER[i]||/^Kamerad \d+$/.test(p.name)))p.name=""});state.cleared=true}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
var pdfBtn=document.getElementById("pdf"),rows=document.getElementById("rows"),msg=document.getElementById("msg");
var dateEl=document.getElementById("date"),evEl=document.getElementById("event");
var nw=new Date();state.date=nw.getFullYear()+"-"+String(nw.getMonth()+1).padStart(2,"0")+"-"+String(nw.getDate()).padStart(2,"0");persist();
var typeEl=document.getElementById("type");
dateEl.value=state.date;evEl.value=state.event;typeEl.value=state.type||"";
typeEl.onchange=function(){state.type=typeEl.value;persist();check()};
dateEl.oninput=function(){state.date=dateEl.value;persist();check()};
evEl.oninput=function(){state.event=evEl.value;persist()};
var ov=document.getElementById("ov"),pc=document.getElementById("pc"),pn=document.getElementById("pn"),pctx,cur=null,done=null,pdraw=false,ptouch=false,pclear=false;
function pinit(){var r=pc.getBoundingClientRect(),d=window.devicePixelRatio||1;pc.width=Math.round(r.width*d);pc.height=Math.round(r.height*d);pctx=pc.getContext("2d");pctx.setTransform(d,0,0,d,0,0);pctx.lineWidth=2.6;pctx.lineCap="round";pctx.lineJoin="round";pctx.strokeStyle="#1f4fd8"}
var curT=false,ps=document.getElementById("ps");
ps.onchange=function(){var m=ps.value==="__man__";pn.hidden=!m;if(m){pn.value="";pn.focus()}};
function openPad(p,cb,isT){cur=p;done=cb;curT=!!isT;ptouch=false;pclear=false;
  pn.hidden=!isT;ps.hidden=!!isT;
  if(isT){pn.value=p.name}else{
    var names=ROSTER.slice();
    ps.innerHTML="";var o0=document.createElement("option");o0.value="";o0.textContent="– Kamerad auswählen –";ps.appendChild(o0);
    names.forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;
      if(state.p.some(function(q){return q!==p&&q.name===n}))o.disabled=true;ps.appendChild(o)});
    var om=document.createElement("option");om.value="__man__";om.textContent="✎ Name von Hand eingeben";ps.appendChild(om);
    var man=!!p.name&&ROSTER.indexOf(p.name)<0;ps.value=man?"__man__":p.name;pn.value=man?p.name:"";pn.hidden=!man}
  ov.hidden=false;pinit();
  if(p.sig){var im=new Image();im.onload=function(){var r=pc.getBoundingClientRect(),k=Math.min(r.width/im.width,r.height/im.height),w=im.width*k,h=im.height*k;pctx.drawImage(im,(r.width-w)/2,(r.height-h)/2,w,h)};im.src=p.sig}}
function pp(e){var r=pc.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
pc.addEventListener("pointerdown",function(e){pdraw=true;ptouch=true;pc.setPointerCapture(e.pointerId);var q=pp(e);pctx.beginPath();pctx.moveTo(q[0],q[1]);pctx.lineTo(q[0]+.1,q[1]+.1);pctx.stroke();e.preventDefault()});
pc.addEventListener("pointermove",function(e){if(!pdraw)return;var q=pp(e);pctx.lineTo(q[0],q[1]);pctx.stroke()});
["pointerup","pointercancel"].forEach(function(n){pc.addEventListener(n,function(){pdraw=false})});
function cropSig(){
  var w=pc.width,h=pc.height,dt=pctx.getImageData?pc.getContext("2d").getImageData(0,0,w,h).data:null,x0=w,y0=h,x1=-1,y1=-1;
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){if(dt[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)return "";
  var m=Math.round(6*(window.devicePixelRatio||1));x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(w-1,x1+m);y1=Math.min(h-1,y1+m);
  var t=document.createElement("canvas");t.width=x1-x0+1;t.height=y1-y0+1;
  t.getContext("2d").drawImage(pc,x0,y0,t.width,t.height,0,0,t.width,t.height);
  return t.toDataURL("image/png")}
document.getElementById("pcl").onclick=function(){pinit();pclear=true;ptouch=false};
document.getElementById("pca").onclick=function(){ov.hidden=true};
document.getElementById("pok").onclick=function(){
  cur.name=(curT||ps.value==="__man__")?pn.value.trim():ps.value;
  if(ptouch)cur.sig=cropSig();else if(pclear)cur.sig="";
  ov.hidden=true;done()};
var trs=[];
var all=[];
function build(i,isT){
  var p=isT?state.t:state.p[i],tr=document.createElement("tr");
  tr.innerHTML=(isT?'<td class="n">A</td><td class="nm"><button class="nb" type="button"></button></td><td class="tl">Unterschrift Ausbilder</td>':'<td class="n">'+(i+1)+'</td><td class="nm"><button class="nb" type="button"></button></td>'+
  S.map(function(s){return '<td class="c"><input type="checkbox" data-s="'+s+'"></td>'}).join(""))+
  '<td class="sg"><img class="sgi" alt=""><span class="act"><button class="clr x" type="button">löschen</button></span></td>';
  var nb=tr.querySelector(".nb"),gi=tr.querySelector(".sgi");
  function show(){nb.textContent=p.name||(isT?"Name Ausbilder":"Kamerad wählen");if(p.sig){gi.src=p.sig;gi.style.display="block"}else{gi.removeAttribute("src");gi.style.display="none"}}
  show();nb.onclick=function(){openPad(p,function(){show();persist();check()},isT)};
  var cbs=tr.querySelectorAll("input[type=checkbox]");
  cbs.forEach(function(cb){
    cb.checked=p.st===cb.dataset.s;
    cb.onchange=function(){
      p.st=cb.checked?cb.dataset.s:"";
      cbs.forEach(function(o){o.checked=p.st===o.dataset.s});
      persist();check();
    };
  });
  tr.querySelector(".x").onclick=function(){p.sig="";show();persist();check()};
  function size(){}
  (isT?document.getElementById("trow"):rows).appendChild(tr);var ent={tr:tr,size:size};all.push(ent);if(isT)tEnt=ent;else trs.push(ent);
}
var tEnt;
for(var i=0;i<N;i++)build(i);
build(0,true);
function complete(i){var p=state.p[i];return p.name.trim()&&(p.sig||p.st)}
function check(){
  var open=0;
  for(var i=0;i<N;i++){var ok=!!complete(i);trs[i].tr.classList.toggle("done",ok);if(!ok)open++}
  var tOk=!!(state.t.name.trim()&&state.t.sig);tEnt.tr.classList.toggle("done",tOk);
  var needDate=!state.date,needType=!state.type;
  var incomplete=open>0||needDate||needType||!tOk;pdfBtn.disabled=false;
  msg.textContent=incomplete?
    ("Noch nicht ausgefüllt: "+(open?open+" von "+N+" Personen (Name, Auswahl, Unterschrift)":"")+((open&&(needDate||needType||!tOk))?" sowie ":"")+[needType?"Art (Einsatz/Ausbildungsdienst)":"",needDate?"Datum":"",tOk?"":"Ausbilder (Name, Unterschrift)"].filter(Boolean).join(", ")):
    "Alles ausgefüllt.";
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function loadImg(src){return new Promise(function(res){if(!src){res(null);return}var i=new Image();i.onload=function(){res(i)};i.onerror=function(){res(null)};i.src=src})}
function fit(im,mw,mh){var k=Math.min(mw/im.width,mh/im.height);return[im.width*k,im.height*k]}
function loadScript(u){return new Promise(function(res){var e=document.createElement("script");e.src=u;e.onload=function(){res(true)};e.onerror=function(){res(false)};document.head.appendChild(e);setTimeout(function(){res(false)},10000)})}
function tmo(pr,ms){return Promise.race([pr,new Promise(function(r){setTimeout(function(){r(null)},ms)})])}
async function genPdf(){
  if(pdfBtn.disabled)return;
  msg.textContent="PDF-Bibliothek wird geladen …";
  if(!(window.jspdf&&window.jspdf.jsPDF))await loadScript("https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js");
  var J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){msg.textContent="PDF-Bibliothek konnte nicht geladen werden (Internetverbindung prüfen).";return}
  var dl=null;try{if(window.claude&&claude.use)dl=await tmo(claude.use("downloads"),6000)}catch(e){}
  msg.textContent="PDF wird erstellt (Unterschriften werden verarbeitet) …";
  var d=new J({orientation:"landscape",unit:"mm",format:"a4"});
  var X=[10,20,90,125,287],H=["Nr.","Name","Bin entschuldigt","Unterschrift"];
  d.setFont("helvetica","bold");d.setFontSize(15);d.text("Anwesenheitsliste",148.5,13,{align:"center"});
  d.setFont("helvetica","normal");d.setFontSize(10);
  var dp=state.date.split("-").reverse().join(".");
  d.text("Art: "+state.type+"     Bezeichnung: "+state.event+"     Datum: "+dp,10,20);
  var y=24,rh=14;
  function row(y,h,fill){if(fill){d.setFillColor(230,230,230);d.rect(10,y,277,h,"F")}d.setDrawColor(0);d.setLineWidth(0.25);d.rect(10,y,277,h);for(var c=1;c<4;c++)d.line(X[c],y,X[c],y+h)}
  function head(){
    row(y,7,true);d.setFont("helvetica","bold");
    H.forEach(function(t,c){d.text(t,c===1?X[c]+2:(X[c]+X[c+1])/2,y+4.8,{align:c===1?"left":"center"})});
    d.setFont("helvetica","normal");y+=7;
  }
  head();
  var imgs=await Promise.all(state.p.map(function(p){return loadImg(p.sig)}));
  var timg=await loadImg(state.t.sig);
  function sig(im,src,x0,x1,y0,h){if(!im)return;var z=fit(im,x1-x0-4,h-1.2);d.addImage(src,src.indexOf("jpeg")>0?"JPEG":"PNG",(x0+x1)/2-z[0]/2,y0+(h-z[1])/2,z[0],z[1])}
  for(var i=0;i<N;i++){
    if(i>0&&i%10===0){d.addPage();y=24;d.setFontSize(10);d.text("Anwesenheitsliste (Fortsetzung)  –  Art: "+state.type+"  –  Datum: "+dp,10,20);head()}
    var p=state.p[i];row(y,rh,false);
    d.text(String(i+1),(X[0]+X[1])/2,y+rh/2+1.6,{align:"center"});
    d.text(p.name,X[1]+2,y+rh/2+1.6,{maxWidth:X[2]-X[1]-4});
    S.forEach(function(k,j){
      var cx=(X[2+j]+X[3+j])/2,s=4;
      d.rect(cx-s/2,y+(rh-s)/2,s,s);
      if(p.st===k){d.setLineWidth(0.5);d.line(cx-s/2+.7,y+(rh-s)/2+.7,cx+s/2-.7,y+(rh+s)/2-.7);d.line(cx+s/2-.7,y+(rh-s)/2+.7,cx-s/2+.7,y+(rh+s)/2-.7);d.setLineWidth(0.25)}
    });
    sig(imgs[i],p.sig,X[3],X[4],y,rh);
    y+=rh;
  }
  y+=4;var th=16;d.setDrawColor(0);d.setLineWidth(0.25);d.rect(10,y,277,th);
  d.setFont("helvetica","bold");d.text("Ausbilder",12,y+4.5);d.setFont("helvetica","normal");
  d.text(state.t.name,12,y+9,{maxWidth:X[3]-14});
  d.line(X[3],y,X[3],y+th);sig(timg,state.t.sig,X[3],X[4],y,th);
  var name=["Anwesenheitsliste",state.type,state.date].filter(Boolean).join("-")+".pdf";
  var name2=name;
  if(!dl){
    var ab=d.output("arraybuffer"),file=null;
    try{file=new File([ab],name2,{type:"application/pdf"})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name2});msg.textContent="PDF geteilt/gespeichert.";return}
      catch(e){if(e&&e.name==="AbortError"){msg.textContent="Speichern abgebrochen.";return}}
    }
    try{d.save(name2);msg.textContent="PDF wurde heruntergeladen (siehe Downloads/Dateien).";}
    catch(e){msg.textContent="Speichern nicht möglich: "+((e&&e.message)||e)}
    return;
  }
  msg.textContent="Warte auf Bestätigung zum Speichern …";
  try{await dl.save({filename:name,data:d.output("arraybuffer")});msg.textContent="Gespeichert."}
  catch(e){msg.textContent=e&&e.code==="declined"?"Speichern abgebrochen.":"Speichern nicht möglich: "+((e&&(e.code+" "+(e.message||"")))||e)}
}
pdfBtn.onclick=function(){genPdf().catch(function(e){msg.textContent="PDF-Fehler: "+((e&&e.message)||e)})};
var rstBtn=document.getElementById("rst"),rstT=null;
function nowStr(){var n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")}
function doReset(){
  state.p=[];for(var i=0;i<N;i++)state.p.push({name:"",st:"",sig:""});
  state.t={name:"",sig:""};state.type="";state.event="";state.date=nowStr();state.seeded=true;
  typeEl.value="";evEl.value="";dateEl.value=state.date;
  rows.innerHTML="";document.getElementById("trow").innerHTML="";trs.length=0;all.length=0;
  for(var k=0;k<N;k++)build(k);build(0,true);
  persist();check();msg.textContent="Liste zurückgesetzt.";
}
rstBtn.onclick=function(){
  if(rstT===null){
    rstBtn.textContent="Wirklich zurücksetzen?";
    rstT=setTimeout(function(){rstT=null;rstBtn.textContent="Zurücksetzen"},4000);
    return;
  }
  clearTimeout(rstT);rstT=null;rstBtn.textContent="Zurücksetzen";doReset();
};
window.addEventListener("load",function(){all.forEach(function(t){t.size()});check()});
window.addEventListener("resize",function(){all.forEach(function(t){t.size()})});
check();
})();
</script>
</body>
</html>
